# The gate for every push to master and every pull request. Two jobs run in parallel:
#   check   the database migrations, applied to an empty Postgres; then pnpm check: typecheck,
#           the migrations compared with the schema, the vitest suite (the database tests
#           included), and the build of both apps
#   chrome  both builds in the runner's Google Chrome, driven through the DevTools protocol
#           (tools/cdp.ts). The single-file studio is opened from file://: parity with the
#           prototype, the page runtime's boil control, and the studio end to end. The web
#           app is served by its own server: the studio inside it, under its policy, and
#           sign-in against the local Supabase stack (supabase/config.toml), which this job
#           starts in Docker with the pinned Supabase CLI (tools/stack.ts).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Next.js would otherwise report anonymous usage from the runner
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres 17, the major a new Supabase project runs. It lives only as long as the job and
    # is reached from the runner alone, so it takes no password ("trust"): there is none to
    # write here.
    services:
      postgres:
        # The image is named by its digest, so that a run uses the build that was tried, not
        # whatever the tag points at that day: Postgres 17.11, built on 21 October 2026. It is
        # the same line as in compose.yaml, and a test fails when the two differ. To move to a
        # newer build, take one that has been public for a week and change both.
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The database tests run when this is set; each makes a database of its own on this server.
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the migrations to the empty database
        run: pnpm db:migrate
      - run: pnpm check

  chrome:
    name: Parity and headless Chrome
    runs-on: ubuntu-latest
    # the stack's first start pulls its images, a minute or two on a runner
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supabase Auth, its Postgres and the mail catcher, with the app's migrations applied;
      # pnpm verify:web reads where they are from the CLI. Google is switched on with a client
      # id that is no one's, so the checks can follow the way to Google's address, and stop
      # there: no Google credentials exist for this project.
      - name: Start the local Supabase stack for the sign-in checks
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED: "true"
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: scena-ci-not-a-client
        run: pnpm stack:start
      - run: pnpm build
      - run: pnpm parity
      # The runner's Chrome changes with the runner image, so the log names it.
      - name: Say which Chrome the checks drive
        run: google-chrome --version
      - run: pnpm verify:runtime
      - run: pnpm verify:studio
      - run: pnpm verify:web
      - name: Keep the screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-studio-screenshots
          path: tools/out
          if-no-files-found: ignore
          retention-days: 7
