# The gate for every push to master and every pull request. Two jobs run in parallel:
#   check   pnpm check: typecheck, the vitest suite, and the build of both apps
#   chrome  both builds in the runner's Google Chrome, driven through the DevTools protocol
#           (tools/cdp.ts). The single-file studio is opened from file://: parity with the
#           prototype, the page runtime's boil control, and the studio end to end. The web
#           app is served by its own server: the studio inside it, under its policy.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Next.js would otherwise report anonymous usage from the runner
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  chrome:
    name: Parity and headless Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm parity
      # The runner's Chrome changes with the runner image, so the log names it.
      - name: Say which Chrome the checks drive
        run: google-chrome --version
      - run: pnpm verify:runtime
      - run: pnpm verify:studio
      - run: pnpm verify:web
      - name: Keep the screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-studio-screenshots
          path: tools/out
          if-no-files-found: ignore
          retention-days: 7
