# The gate for every push to master and every pull request. Two jobs run in parallel:
#   check   the database migrations, applied to an empty Postgres and compared with the schema;
#           then pnpm check: typecheck, the vitest suite (the database tests included), and
#           the build of both apps
#   chrome  both builds in the runner's Google Chrome, driven through the DevTools protocol
#           (tools/cdp.ts). The single-file studio is opened from file://: parity with the
#           prototype, the page runtime's boil control, and the studio end to end. The web
#           app is served by its own server: the studio inside it, under its policy.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Next.js would otherwise report anonymous usage from the runner
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres 17, the major a new Supabase project runs, as in compose.yaml. It lives only as
    # long as the job and is reached from the runner alone, so it takes no password ("trust"):
    # there is none to write here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The database tests run when this is set; each makes a database of its own on this server.
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the migrations to the empty database
        run: pnpm db:migrate
      - name: Check that the migrations match the schema
        run: pnpm db:check
      - run: pnpm check

  chrome:
    name: Parity and headless Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm parity
      # The runner's Chrome changes with the runner image, so the log names it.
      - name: Say which Chrome the checks drive
        run: google-chrome --version
      - run: pnpm verify:runtime
      - run: pnpm verify:studio
      - run: pnpm verify:web
      - name: Keep the screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-studio-screenshots
          path: tools/out
          if-no-files-found: ignore
          retention-days: 7
