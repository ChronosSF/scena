<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pia Morandi, illustrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #F1F3F0;
  --mat: #E3EAE5;
  --card: #FBFCFA;
  --grid: rgba(43, 63, 134, 0.13);
  --line: #2B3F86;
  --pink: #FF5DAE;
  --yellow: #FFD93D;
  --text: #22306A;
  --muted: #4E5B8E;
  --blend: multiply;
  --fill-op: 1;
  --font: "Shantell Sans", "Chalkboard SE", "Comic Neue", "Segoe Print", "Trebuchet MS", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #191C2E;
    --mat: #20253B;
    --card: #23283F;
    --grid: rgba(180, 195, 245, 0.11);
    --line: #B4C3F5;
    --pink: #EE5FA6;
    --yellow: #E6C23A;
    --text: #E6EAF8;
    --muted: #A9B2D6;
    --blend: normal;
    --fill-op: 0.85;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #191C2E;
  --mat: #20253B;
  --card: #23283F;
  --grid: rgba(180, 195, 245, 0.11);
  --line: #B4C3F5;
  --pink: #EE5FA6;
  --yellow: #E6C23A;
  --text: #E6EAF8;
  --muted: #A9B2D6;
  --blend: normal;
  --fill-op: 0.85;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.5;
}
.page {
  max-width: 30rem;
  margin: 0 auto;
  padding: 2rem 1.25rem 3rem;
}

/* Header */
.name {
  margin: 0;
  font-size: clamp(2.6rem, 12vw, 3.5rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.01em;
  color: var(--line);
  text-shadow: 3px 3px 0 var(--pink);
  transform: rotate(-2deg);
  transform-origin: left center;
}
.bio {
  margin: 0.9rem 0 0;
  max-width: 32ch;
  color: var(--muted);
  font-size: 1.05rem;
}

/* Desk */
.desk { margin: 1.5rem -0.5rem 0; }
.desk svg { display: block; width: 100%; height: auto; overflow: visible; }
.mat { fill: var(--mat); }
.grid line { stroke: var(--grid); stroke-width: 1; }
.deco { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; opacity: 0.28; }
.line { fill: none; stroke: var(--line); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.solid { fill: var(--line); stroke: none; }
.fills { mix-blend-mode: var(--blend); opacity: var(--fill-op); }
.p { fill: var(--pink); }
.y { fill: var(--yellow); }
.tail-fill { fill: none; stroke: var(--yellow); stroke-width: 9; stroke-linecap: round; }
.svg-text { font-family: var(--font); font-weight: 600; fill: var(--line); font-size: 15px; }

.obj { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.obj .lift { transition: transform 0.18s ease; transform-box: fill-box; transform-origin: center; }
.obj:hover .lift, .obj.selected .lift { transform: translate(-1px, -4px); }
.ring {
  fill: none;
  stroke: var(--pink);
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  transition: stroke-dashoffset 0.55s ease;
}
.obj.selected .ring { stroke-dashoffset: 0; }
.obj:focus-visible .ring { stroke-dashoffset: 0; stroke: var(--line); stroke-dasharray: 0.02 0.014; }
.eyes-open, .prr { display: none; }
.obj.selected .eyes-open, .obj.selected .prr { display: inline; }
.obj.selected .eyes-closed, .obj.selected .zzz { display: none; }

/* Tag panel */
.tag {
  margin-top: 1rem;
  min-height: 10rem;
  padding: 1.1rem 1.2rem 1.2rem;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
}
.hint { margin: 0; color: var(--muted); font-size: 1.1rem; }
.tag h2 { margin: 0; font-size: 1.45rem; font-weight: 800; line-height: 1.2; color: var(--line); }
.tag p.desc { margin: 0.35rem 0 1rem; max-width: 36ch; }
.btn {
  display: inline-block;
  padding: 0.6rem 1.1rem;
  background: var(--line);
  color: var(--paper);
  font-family: var(--font);
  font-weight: 800;
  font-size: 1rem;
  text-decoration: none;
  border: 0;
  border-radius: 12px 4px 14px 5px;
  box-shadow: 4px 4px 0 var(--pink);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--pink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--pink); }
.btn:focus-visible, .links a:focus-visible { outline: 3px dashed var(--pink); outline-offset: 4px; }

/* Plain list */
.links-h { margin: 2.25rem 0 0.25rem; font-size: 1.1rem; font-weight: 600; color: var(--muted); }
.links ul { list-style: none; margin: 0; padding: 0; }
.links a {
  display: block;
  padding: 0.75rem 0.1rem;
  border-bottom: 2px dashed var(--grid);
  color: var(--text);
  font-weight: 600;
  font-size: 1.1rem;
  text-decoration: none;
}
.links a:hover { color: var(--line); text-decoration: underline; text-decoration-color: var(--pink); text-decoration-thickness: 3px; text-underline-offset: 4px; }
.foot { margin: 2rem 0 0; color: var(--muted); font-size: 0.9rem; }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 1rem);
  width: min(26rem, calc(100% - 2rem));
  padding: 0.75rem 1rem;
  background: var(--line);
  color: var(--paper);
  border-radius: 14px 6px 16px 6px;
  box-shadow: 4px 4px 0 var(--pink);
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .obj .lift, .ring, .btn, .toast { transition: none; }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <h1 class="name">Pia Morandi</h1>
    <p class="bio">Illustrator in Turin. Picture books, plants, and one orange cat.</p>
  </header>

  <figure class="desk">
    <svg viewBox="0 0 400 440" role="group" aria-label="Pia’s desk. Each object opens one of her links.">
      <defs>
        <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="2" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>

      <rect class="mat" x="6" y="6" width="388" height="428" rx="18"/>
      <g class="grid" id="grid"></g>

      <!-- quiet desk clutter -->
      <g class="deco">
        <circle cx="190" cy="80" r="30" stroke-dasharray="150 38"/>
        <circle cx="190" cy="80" r="25" stroke-dasharray="40 30 70 20"/>
        <g transform="translate(198 372) rotate(18)">
          <rect x="0" y="0" width="36" height="18" rx="4"/>
          <path d="M13 0 L13 18"/>
        </g>
        <path d="M244 400 l3 2 M252 408 l2 -2 M240 410 l3 1"/>
      </g>

      <g class="scene" filter="url(#boil)">

        <!-- Pencil cup: Instagram -->
        <g class="obj" data-key="cup" role="button" tabindex="0" aria-label="Pencil cup: daily sketches on Instagram" transform="translate(42 34) rotate(-4)">
          <g class="lift">
            <g class="fills" transform="translate(3 3)">
              <g transform="translate(20 46) rotate(-12)"><polygon class="y" points="-5,0 -5,-38 0,-50 5,-38 5,0"/></g>
              <g transform="translate(37 44) rotate(4)"><polygon class="y" points="-5,0 -5,-38 0,-50 5,-38 5,0"/></g>
              <g transform="translate(53 46) rotate(17)"><path class="p" d="M-4 -40 Q0 -62 4 -40 Z"/></g>
              <path class="p" d="M2 46 Q35 54 68 46 L62 108 Q35 115 8 108 Z"/>
            </g>
            <g transform="translate(20 46) rotate(-12)"><path class="line" d="M-5 0 L-5 -38 L0 -50 L5 -38 L5 0 M-5 -38 L5 -38"/></g>
            <g transform="translate(37 44) rotate(4)"><path class="line" d="M-5 0 L-5 -38 L0 -50 L5 -38 L5 0 M-5 -38 L5 -38"/></g>
            <g transform="translate(53 46) rotate(17)"><path class="line" d="M0 0 L0 -40 M-4 -40 Q0 -62 4 -40 Z"/></g>
            <path class="line" d="M2 46 Q35 54 68 46 L62 108 Q35 115 8 108 Z"/>
            <ellipse class="line" cx="35" cy="46" rx="33" ry="7"/>
            <path class="line" d="M12 74 Q35 80 58 74"/>
          </g>
          <ellipse class="ring" pathLength="1" cx="35" cy="50" rx="54" ry="70" transform="rotate(-6 35 50)"/>
        </g>

        <!-- Framed print: shop -->
        <g class="obj" data-key="print" role="button" tabindex="0" aria-label="Framed print: the print shop" transform="translate(274 16) rotate(5)">
          <g class="lift">
            <g class="fills" transform="translate(3 3)">
              <circle class="y" cx="62" cy="40" r="11"/>
              <path class="p" d="M12 98 Q30 64 48 82 Q62 58 84 98 Z"/>
            </g>
            <rect class="line" x="0" y="0" width="96" height="118" rx="3"/>
            <rect class="line" x="11" y="11" width="74" height="96"/>
            <circle class="line" cx="62" cy="40" r="11"/>
            <path class="line" d="M12 98 Q30 64 48 82 Q62 58 84 98"/>
            <path class="line" d="M60 101 q4 -4 8 0 t8 0" stroke-width="1.8"/>
          </g>
          <ellipse class="ring" pathLength="1" cx="48" cy="59" rx="64" ry="76" transform="rotate(4 48 59)"/>
        </g>

        <!-- Sketchbook: portfolio -->
        <g class="obj" data-key="sketchbook" role="button" tabindex="0" aria-label="Sketchbook: portfolio" transform="translate(92 168) rotate(-5)">
          <g class="lift">
            <g class="fills" transform="translate(3 3)">
              <rect class="y" x="16" y="84" width="36" height="32"/>
              <path class="p" d="M150 94 Q128 62 152 30 Q174 62 150 94 Z"/>
              <path class="p" d="M150 94 Q178 80 186 54 Q160 58 150 94 Z"/>
              <circle class="y" cx="124" cy="40" r="11"/>
            </g>
            <path class="line" d="M100 4 Q50 -2 2 6 L6 132 Q52 124 100 130 Z"/>
            <path class="line" d="M100 4 Q150 -2 198 6 L194 132 Q148 124 100 130 Z"/>
            <g class="line" stroke-width="2">
              <ellipse cx="100" cy="14" rx="5" ry="3"/><ellipse cx="100" cy="28" rx="5" ry="3"/>
              <ellipse cx="100" cy="42" rx="5" ry="3"/><ellipse cx="100" cy="56" rx="5" ry="3"/>
              <ellipse cx="100" cy="70" rx="5" ry="3"/><ellipse cx="100" cy="84" rx="5" ry="3"/>
              <ellipse cx="100" cy="98" rx="5" ry="3"/><ellipse cx="100" cy="112" rx="5" ry="3"/>
            </g>
            <path class="line" stroke-width="1.8" d="M16 26 q8 -5 16 0 t16 0 t16 0 t16 0 M16 40 q8 -5 16 0 t16 0 t16 0 M16 54 q8 -5 16 0 t16 0 t16 0 t16 0 M16 68 q8 -5 16 0 t16 0"/>
            <rect class="line" x="16" y="84" width="36" height="32" stroke-width="2"/>
            <path class="line" d="M150 94 Q128 62 152 30 Q174 62 150 94 M150 92 L152 36"/>
            <path class="line" d="M150 94 Q178 80 186 54 Q160 58 150 94"/>
            <circle class="line" cx="124" cy="40" r="11"/>
          </g>
          <ellipse class="ring" pathLength="1" cx="100" cy="68" rx="122" ry="86" transform="rotate(3 100 68)"/>
        </g>

        <!-- Cat: newsletter -->
        <g class="obj" data-key="cat" role="button" tabindex="0" aria-label="Biscotto the cat: monthly letter" transform="translate(38 306)">
          <g class="lift">
            <g class="fills" transform="translate(3 3)">
              <path class="y" d="M48 30 Q90 14 132 32 Q156 52 140 84 Q112 112 60 104 Q40 100 36 78 Z"/>
              <path class="tail-fill" d="M138 86 Q148 112 104 116 Q66 120 42 106"/>
              <circle class="y" cx="30" cy="54" r="24"/>
              <path class="y" d="M12 44 L8 24 L24 33 Z M36 31 L50 20 L52 40 Z"/>
              <path class="p" d="M27 60 L33 60 L30 64 Z"/>
            </g>
            <path class="line" d="M48 30 Q90 14 132 32 Q156 52 140 84 Q112 112 60 104 Q46 101 40 90"/>
            <path class="line" d="M138 86 Q148 112 104 116 Q66 120 42 106"/>
            <circle class="line" cx="30" cy="54" r="24"/>
            <path class="line" d="M12 44 L8 24 L24 33 M36 31 L50 20 L52 40"/>
            <path class="line" stroke-width="2" d="M84 26 q-4 10 0 18 M102 25 q-4 12 0 20 M120 31 q-4 10 0 16"/>
            <path class="line" stroke-width="1.6" d="M10 60 L-6 57 M10 64 L-6 67 M50 60 L64 57 M50 64 L64 67"/>
            <path class="line" stroke-width="1.6" d="M27 60 L33 60 L30 64 Z"/>
            <g class="eyes-closed"><path class="line" stroke-width="2" d="M18 52 q4 4 8 0 M34 52 q4 4 8 0"/></g>
            <g class="eyes-open"><circle class="solid" cx="22" cy="52" r="3.2"/><circle class="solid" cx="38" cy="52" r="3.2"/></g>
            <text class="svg-text zzz" x="58" y="22">z z</text>
            <text class="svg-text prr" x="56" y="20">prrr</text>
          </g>
          <ellipse class="ring" pathLength="1" cx="76" cy="68" rx="90" ry="62" transform="rotate(-3 76 68)"/>
        </g>

        <!-- Envelope: commissions -->
        <g class="obj" data-key="envelope" role="button" tabindex="0" aria-label="Envelope: commissions" transform="translate(246 322) rotate(-7)">
          <g class="lift">
            <g class="fills" transform="translate(3 3)">
              <rect class="y" x="92" y="8" width="22" height="26"/>
              <circle class="p" cx="62" cy="46" r="9"/>
            </g>
            <rect class="line" x="0" y="0" width="124" height="78" rx="4"/>
            <path class="line" d="M3 3 L62 46 L121 3 M3 75 L48 40 M121 75 L76 40"/>
            <rect class="line" x="92" y="8" width="22" height="26" stroke-width="1.8" stroke-dasharray="2.5 2.5"/>
            <circle class="line" cx="62" cy="46" r="9"/>
            <path class="line" stroke-width="1.6" d="M62 50 L58 46 Q56 42 60 42 Q62 42 62 44 Q62 42 64 42 Q68 42 66 46 Z"/>
          </g>
          <ellipse class="ring" pathLength="1" cx="62" cy="40" rx="80" ry="56" transform="rotate(5 62 40)"/>
        </g>

      </g>
    </svg>
  </figure>

  <section class="tag" aria-live="polite">
    <p class="hint" id="hint">Tap anything on my desk.</p>
    <div id="tagBody" hidden>
      <h2 id="tagTitle"></h2>
      <p class="desc" id="tagText"></p>
      <a class="btn" id="tagBtn" href="#"></a>
    </div>
  </section>

  <nav class="links" aria-labelledby="links-h">
    <h2 class="links-h" id="links-h">Or skip the desk</h2>
    <ul>
      <li><a href="#" data-key="sketchbook">Portfolio</a></li>
      <li><a href="#" data-key="print">Print shop</a></li>
      <li><a href="#" data-key="envelope">Commissions</a></li>
      <li><a href="#" data-key="cup">Instagram</a></li>
      <li><a href="#" data-key="cat">Monthly letter</a></li>
    </ul>
  </nav>

  <p class="foot">Demo page. The links are placeholders.</p>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
const LINKS = {
  sketchbook: { title: "Sketchbook", text: "Finished work: picture books, packaging, and a lot of plants.", cta: "See my portfolio", dest: "open behance.net/piamorandi" },
  print: { title: "Framed print", text: "Signed prints and small risograph zines, posted from Turin.", cta: "Visit the print shop", dest: "open piamorandi.shop" },
  envelope: { title: "Envelope", text: "Book covers, editorial work and pet portraits. Booking for spring 2027.", cta: "Ask about a commission", dest: "start an email to studio@piamorandi.it" },
  cup: { title: "Pencil cup", text: "Daily sketches, process videos and the occasional ruined page.", cta: "Follow on Instagram", dest: "open instagram.com/piamorandi" },
  cat: { title: "Biscotto", text: "The studio cat. He guards a monthly letter with new work and early print drops.", cta: "Get the monthly letter", dest: "open piamorandi.substack.com" }
};

// cutting-mat grid
const grid = document.getElementById("grid");
const NS = "http://www.w3.org/2000/svg";
for (let x = 30; x < 394; x += 24) {
  const l = document.createElementNS(NS, "line");
  l.setAttribute("x1", x); l.setAttribute("x2", x); l.setAttribute("y1", 6); l.setAttribute("y2", 434);
  grid.appendChild(l);
}
for (let y = 30; y < 434; y += 24) {
  const l = document.createElementNS(NS, "line");
  l.setAttribute("y1", y); l.setAttribute("y2", y); l.setAttribute("x1", 6); l.setAttribute("x2", 394);
  grid.appendChild(l);
}

// line boil
const turb = document.getElementById("turb");
const seeds = [2, 7, 13];
let seedIndex = 0, timer = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
function startBoil() {
  if (timer || reduceMotion.matches || document.hidden) return;
  timer = setInterval(() => {
    seedIndex = (seedIndex + 1) % seeds.length;
    turb.setAttribute("seed", seeds[seedIndex]);
  }, 150);
}
function stopBoil() { clearInterval(timer); timer = null; }
document.addEventListener("visibilitychange", () => document.hidden ? stopBoil() : startBoil());
reduceMotion.addEventListener?.("change", () => reduceMotion.matches ? stopBoil() : startBoil());
startBoil();

// selection
const objs = [...document.querySelectorAll(".obj")];
const hint = document.getElementById("hint");
const body = document.getElementById("tagBody");
const tTitle = document.getElementById("tagTitle");
const tText = document.getElementById("tagText");
const tBtn = document.getElementById("tagBtn");

function select(key) {
  objs.forEach(o => {
    const on = o.dataset.key === key;
    o.classList.toggle("selected", on);
    o.setAttribute("aria-pressed", on ? "true" : "false");
  });
  const d = LINKS[key];
  hint.hidden = true;
  body.hidden = false;
  tTitle.textContent = d.title;
  tText.textContent = d.text;
  tBtn.textContent = d.cta;
  tBtn.dataset.key = key;
}
objs.forEach(o => {
  o.setAttribute("aria-pressed", "false");
  o.addEventListener("click", () => select(o.dataset.key));
  o.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(o.dataset.key); }
  });
});

// demo links
const toast = document.getElementById("toast");
let toastTimer;
function openDemo(key) {
  toast.textContent = "Demo only. On a live page this would " + LINKS[key].dest + ".";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
}
tBtn.addEventListener("click", e => { e.preventDefault(); openDemo(tBtn.dataset.key); });
document.querySelectorAll(".links a").forEach(a => {
  a.addEventListener("click", e => { e.preventDefault(); openDemo(a.dataset.key); });
});
</script>
</body>
</html>
