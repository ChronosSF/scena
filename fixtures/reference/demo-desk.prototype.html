*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.5}
.page{max-width:30rem;margin:0 auto;padding:2rem 1.25rem 3rem}

.bio{margin:.9rem 0 0;max-width:32ch;color:var(--muted);font-size:1.05rem}
.desk{margin:1.5rem -.5rem 0}
.desk svg{display:block;width:100%;height:auto;overflow:visible}
.mat{fill:var(--mat)}
.grid line{stroke:var(--grid);stroke-width:1}
.dot{fill:var(--grid)}
.ink{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.raster>.lift,.raster>.art{mix-blend-mode:var(--blend)}
.sticker{display:none;fill:var(--sticker)}

.obj{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.obj .lift{transition:transform 180ms ease;transform-box:fill-box;transform-origin:center}
.obj:hover .lift,.obj.hov .lift,.obj.selected .lift{transform:translate(-1px,-4px)}
.ring{fill:none;stroke:var(--accent1);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 550ms ease}
.obj.selected .ring{stroke-dashoffset:0}.obj.noring.selected .ring{stroke-dashoffset:1}
.obj:focus-visible .ring{stroke-dashoffset:0;stroke:var(--line);stroke-dasharray:.02 .014}
.w-sel{display:none}.obj.selected .w-sel{display:inline}.obj.selected .w-idle{display:none}
.w-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .w-dark{display:inline}}:root[data-theme="dark"] .w-dark{display:inline}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .w-light{display:none}}:root[data-theme="dark"] .w-light{display:none}

.hint{margin:0;color:var(--muted);font-size:1.1rem}
.tag h2{margin:0;font-size:1.45rem;font-weight:800;line-height:1.2;color:var(--line)}
.stat{margin:.35rem 0 0;font-weight:600;font-size:.95rem}

.stat.s-open::before{background:var(--accent2)}.stat.s-waitlist::before{background:var(--accent1)}

.btn{display:inline-block;padding:.6rem 1.1rem;background:var(--line);color:var(--paper);font-family:var(--font);font-weight:800;font-size:1rem;text-decoration:none;border:0;border-radius:12px 4px 14px 5px;box-shadow:4px 4px 0 var(--accent1);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--accent1)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--accent1)}
.btn:focus-visible,.links a:focus-visible,.foot a:focus-visible{outline:3px dashed var(--accent1);outline-offset:4px}
.links-h{margin:2.25rem 0 .25rem;font-size:1.1rem;font-weight:600;color:var(--muted)}
.links ul{list-style:none;margin:0;padding:0}

.links a:hover{color:var(--line);text-decoration:underline;text-decoration-color:var(--accent1);text-decoration-thickness:3px;text-underline-offset:4px}
.links .ls{font-weight:400;color:var(--muted);font-size:.95rem}
.foot{margin:2rem 0 0;color:var(--muted);font-size:.9rem}.foot a{color:inherit}
